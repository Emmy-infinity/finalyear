yamlservices:
  - type: web
    name: caninstitute-web
    env: python
    buildCommand: "./build.sh"  # Or your specific build steps
    startCommand: "gunicorn CANINSTITUTE2.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caninstitute-db # Must match the database name defined below
          property: connectionString

databases:
  - name: caninstitute-db
    plan: free
