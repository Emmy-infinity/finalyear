services:
  - type: web
    name: my-heroku-app
    env: node # or python, ruby, etc.
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-render-db
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: my-render-db
    plan: free
